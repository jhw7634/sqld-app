<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>JS 문제집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4150C8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JS 문제집">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow phone column. Home → 문제 목록 → 문제 화면, plus 이론 노트. Accent = indigo, logo = JS yellow. */
:root {
  --bg: #F4F5F9;
  --surface: #FFFFFF;
  --ink: #171A2B;
  --muted: #5E6378;
  --rule: #DDE0EA;
  --line: #4150C8;
  --line-soft: #E8EAFB;
  --ok: #1E8A55; --ok-soft: #E4F4EB;
  --bad: #C8423A; --bad-soft: #FBE9E7;
  --warn: #9A6400; --warn-soft: #FFF3D6;
  --code-bg: #EEF0F6;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, "IBM Plex Sans KR", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F111A; --surface: #171A26; --ink: #E6E8F2; --muted: #9499AE; --rule: #2A2E40;
  --line: #8C98FF; --line-soft: #20243D;
  --ok: #4CC38A; --ok-soft: #163327; --bad: #F07A70; --bad-soft: #3A1E1C; --warn: #E8B04A; --warn-soft: #3A2E14;
  --code-bg: #1F2332; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F111A; --surface: #171A26; --ink: #E6E8F2; --muted: #9499AE; --rule: #2A2E40;
  --line: #8C98FF; --line-soft: #20243D;
  --ok: #4CC38A; --ok-soft: #163327; --bad: #F07A70; --bad-soft: #3A1E1C; --warn: #E8B04A; --warn-soft: #3A2E14;
  --code-bg: #1F2332; color-scheme: dark; }

* { box-sizing: border-box; }
/* 코드 글꼴의 합자(=> 가 ⇒, === 가 ≡ 로 바뀌는 것)를 끈다: 배우는 사람은 실제 글자를 봐야 한다 */
code, pre, textarea, .key, .ex, .t, .choice .c { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 12px 48px; display: flex; flex-direction: column; gap: 14px; }
[hidden] { display: none !important; }

header.top { padding-block: 6px 0; display: flex; flex-direction: column; gap: 10px; }
.bar-top { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.bar-top h1 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score b { color: var(--ink); }
.stnav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.stnav .btn { font-size: 14px; padding: 9px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stnav #prevSt { justify-self: start; } .stnav #nextSt { justify-self: end; }
.stnow { font-family: var(--f-display); font-size: 18px; color: var(--line); white-space: nowrap; }

.modebar { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--line); border-color: var(--line); color: var(--surface); }
.pill:disabled { opacity: .45; cursor: default; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.tag { padding: 2px 8px; border-radius: 6px; background: var(--line-soft); color: var(--line); font-weight: 700; letter-spacing: .02em; }
.tag.trap { background: var(--warn-soft); color: var(--warn); }
.tag.mc { background: var(--code-bg); color: var(--muted); }
.tag.solved { background: var(--ok-soft); color: var(--ok); }
.qnum { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.q { font-size: 17px; font-weight: 500; margin: 0; text-wrap: pretty; }
.q code, .fb code, .exp code, .lesson p code, .tipbox code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: 0 4px; border-radius: 4px; }

.examples { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.examples .lab { font-size: 12px; color: var(--muted); }
.ex { font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 1.2em; text-indent: -1.2em; }
.ex::-webkit-scrollbar { display: none; }
.ex .arr { color: var(--muted); } .ex .val { color: var(--ok); font-weight: 600; }

pre.code { margin: 0; background: var(--code-bg); border-radius: 10px; padding: 10px 12px; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; overflow-x: auto; white-space: pre; }

.editor { display: flex; flex-direction: column; gap: 8px; }
textarea#src { width: 100%; min-height: 150px; resize: vertical; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.55; tab-size: 2;
  padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--code-bg); color: var(--ink); white-space: pre; overflow-x: auto; }
textarea#src:focus { outline: none; border-color: var(--line); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys:empty { display: none; }
.key { flex: none; font-family: var(--f-mono); font-size: 13.5px; min-width: 34px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key.kw { color: var(--line); font-weight: 600; }
.key.fn { color: var(--warn); font-weight: 600; }
.key.nm { background: var(--code-bg); }
.key.val { color: var(--ok); font-weight: 600; }
.key.ctl { color: var(--muted); }
.key:active { background: var(--line-soft); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--line); border-color: var(--line); color: var(--surface); flex: 1; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); font-weight: 500; padding-inline: 8px; }
.btn.theory { color: var(--line); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .key:focus-visible, .pill:focus-visible, .choice:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; font: inherit; font-size: 14.5px; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; gap: 10px; }
.choice .n { font-family: var(--f-display); color: var(--line); flex: none; width: 1.2em; }
.choice .c { font-family: var(--f-mono); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.choice.picked-bad { border-color: var(--bad); background: var(--bad-soft); }
.choice.picked-ok { border-color: var(--ok); background: var(--ok-soft); }

.fb { border-radius: 10px; padding: 12px 14px; font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fb.ok { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); } .fb.info { background: var(--code-bg); } .fb.hint { background: var(--warn-soft); }
.fb h3 { margin: 0; font-size: 15px; }
.fb.ok h3 { color: var(--ok); } .fb.bad h3 { color: var(--bad); } .fb.hint h3 { color: var(--warn); }
.fb p { margin: 0; }
.fb .btn.theory { align-self: flex-start; padding: 6px 12px; font-size: 14px; background: var(--surface); border-color: var(--rule); }
.result-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tests { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.t { font-family: var(--f-mono); font-size: 12.5px; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; align-items: start; }
.t .mk { font-weight: 700; } .t.ok .mk { color: var(--ok); } .t.bad .mk { color: var(--bad); }
.t .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.t .body::-webkit-scrollbar { display: none; }
.t .want { color: var(--muted); }
pre.logs { margin: 0; font-family: var(--f-mono); font-size: 12.5px; background: var(--surface); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; }

.exp { border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 10px; }
.exp .row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; }
.exp .lab { font-family: var(--f-display); font-size: 14px; color: var(--line); padding-top: 1px; }
.exp .row p { margin: 0; min-width: 0; }
.exp .btn.theory { justify-self: start; }

.nav { display: flex; gap: 8px; }
.nav .btn { flex: 1; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.resetbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 12px; cursor: pointer; }

.hero { display: flex; align-items: center; gap: 14px; padding-top: 18px; }
.hero .logo { width: 64px; height: 64px; flex: none; border-radius: 15px; box-shadow: 0 2px 8px rgba(23,26,43,.15); }
.hero > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; }
.prog { display: flex; flex-direction: column; gap: 10px; }
.prog .big { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.prog .big b { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; color: var(--line); }
.prog .big span { color: var(--muted); font-size: 15px; }
.bar { height: 10px; border-radius: 5px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--line); border-radius: 5px; transition: width .4s; }
.bar.thin { height: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--code-bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); }
.btn.big { width: 100%; padding: 14px 16px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn.big small { font-weight: 500; font-size: 13px; opacity: .85; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu .btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; }
.menu .btn small { font-weight: 500; font-size: 12px; color: var(--muted); }
.menu .btn.wide { grid-column: 1 / -1; }
.sect { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 6px 0 -4px; }
.topics { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.topic:last-child { border-bottom: 0; }
.topic .tn { font-weight: 700; }
.topic .tc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic .bar { grid-column: 1 / -1; }
.topic:active, .lrow:active { background: var(--line-soft); }
.topic:focus-visible, .lrow:focus-visible { outline: 2px solid var(--line); outline-offset: -2px; }

.btn.back { padding: 7px 12px; font-size: 14px; flex: none; }
.lsec { display: flex; flex-direction: column; gap: 6px; }
.lsec h2 { font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--line); margin: 8px 0 0; display: flex; justify-content: space-between; align-items: baseline; }
.lsec h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.lbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.lrow:last-child { border-bottom: 0; }
.lrow .no { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); text-align: center; }
.lrow .tx { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; }
.lrow .tx .tag { font-size: 11px; margin-right: 4px; padding: 1px 6px; }
.lrow .stt { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.lrow .stt.ok { background: var(--ok-soft); color: var(--ok); }
.lrow .stt.bad { background: var(--bad-soft); color: var(--bad); }
.lrow .stt.no { color: var(--muted); font-weight: 500; }
.lrow.cur { background: var(--line-soft); }
.empty { text-align: center; color: var(--muted); padding: 24px 0; margin: 0; }

.tchips { display: flex; gap: 6px; flex-wrap: wrap; }
.lesson { scroll-margin-top: 12px; }
.lesson h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; color: var(--line); margin: 0; }
.lesson p { margin: 0; }
.lesson pre.code { font-size: 12.5px; }
.tipbox { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.tipbox b { color: var(--warn); }
.lesson.focus { border-color: var(--line); box-shadow: 0 0 0 2px var(--line-soft); }
.lesson .go { align-self: flex-start; }

.install { display: flex; flex-direction: column; gap: 8px; }
.installbtn { width: 100%; border-color: var(--line); color: var(--line); }
.iguide { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.iguide p { margin: 0; } .iguide b { color: var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap screen" id="homeView">
  <header class="hero">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64" role="img" aria-label="JS 문제집 로고">
      <rect width="512" height="512" rx="112" fill="#F7D63E"/>
      <g fill="none" stroke="#171A2B" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
        <path d="M176 150 L86 240 L176 330"/>
        <path d="M300 150 L390 240 L300 330"/>
        <path d="M266 120 L210 360"/>
      </g>
      <circle cx="384" cy="384" r="84" fill="#4150C8" stroke="#F7D63E" stroke-width="18"/>
      <path d="M342 386 l28 28 l54 -60" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><h1>JS 문제집</h1>
    <p>짬날 때 한 문제씩. 버튼으로 조립하고, 폰 안에서 진짜로 실행해서 채점해요.</p></div>
  </header>
  <section class="card prog" aria-label="내 진행 상황">
    <div class="big"><b id="hSolved">0</b><span id="hTotal">/ 0 문제 맞힘</span></div>
    <div class="bar" aria-hidden="true"><i id="hBar" style="width:0"></i></div>
    <div class="stats">
      <div class="stat ok"><b id="hOk">0</b><span>한 번에 정답</span></div>
      <div class="stat bad"><b id="hBad">0</b><span>오답 노트</span></div>
      <div class="stat"><b id="hLeft">0</b><span>안 푼 문제</span></div>
    </div>
  </section>
  <button class="btn primary big" id="hContinue">이어서 풀기 <small id="hContinueSub"></small></button>
  <div class="menu">
    <button class="btn" id="hList">문제 목록<small>번호·주제별로 골라 풀기</small></button>
    <button class="btn" id="hWrong">오답 다시 풀기<small id="hWrongSub">틀린 문제만</small></button>
    <button class="btn" id="hTrap">함정만 풀기<small id="hTrapSub">헷갈리는 출력 문제</small></button>
    <button class="btn" id="hFresh">안 푼 문제부터<small>처음 보는 문제</small></button>
    <button class="btn wide" id="hTheory">📖 이론 노트<small>주제별 한 장 요약 · 막히면 먼저 읽기</small></button>
  </div>
  <h2 class="sect">주제별 진도</h2>
  <div class="topics" id="hTopics"></div>
  <div class="install" id="hInstall"><button class="btn installbtn" data-install>홈 화면에 추가</button><div class="iguide" hidden></div></div>
  <p class="foot"><button class="resetbtn" id="hReset">기록 초기화</button> <span id="hResetConfirm" hidden>정말 지울까요? <button class="resetbtn" id="hResetYes">네, 지우기</button></span></p>
</div>

<div class="wrap screen" id="listView" hidden>
  <header class="top">
    <div class="bar-top"><button class="btn back" id="lHome">◀ 홈</button><h1>문제 목록</h1><span class="score" id="lScore"></span></div>
    <div class="modebar" role="group" aria-label="목록 거르기">
      <button class="pill" data-f="all" aria-pressed="true">전체</button>
      <button class="pill" data-f="todo" aria-pressed="false">안 푼 문제</button>
      <button class="pill" data-f="wrong" aria-pressed="false">오답</button>
      <button class="pill" data-f="trap" aria-pressed="false">함정</button>
    </div>
  </header>
  <div id="lBody" style="display:flex;flex-direction:column;gap:6px"></div>
</div>

<div class="wrap screen" id="theoryView" hidden>
  <header class="top">
    <div class="bar-top"><button class="btn back" id="tBack">◀ 뒤로</button><h1>이론 노트</h1></div>
    <div class="tchips" id="tChips"></div>
  </header>
  <div id="tBody" style="display:flex;flex-direction:column;gap:12px"></div>
</div>

<div class="wrap screen" id="quizView" hidden>
  <header class="top">
    <div class="bar-top"><button class="btn back" id="qHome">◀ 홈</button><h1>JS 문제집</h1><span class="score" id="score"></span><button class="pill" id="listBtn">문제 목록</button></div>
    <div class="stnav">
      <button class="btn" id="prevSt" aria-label="이전 주제로">◀ <span id="prevStName"></span></button>
      <span class="stnow" id="stNow"></span>
      <button class="btn" id="nextSt" aria-label="다음 주제로"><span id="nextStName"></span> ▶</button>
    </div>
    <div class="modebar">
      <button class="pill" id="modeAll" aria-pressed="true">전체 문제</button>
      <button class="pill" id="modeWrong" aria-pressed="false">오답 다시 풀기</button>
      <button class="pill" id="modeTrap" aria-pressed="false">함정만</button>
    </div>
  </header>

  <main class="card" id="card" aria-live="polite">
    <div class="meta" id="meta"></div>
    <p class="q" id="q"></p>
    <div id="codeWrap"></div>
    <div id="answerArea"></div>

// 사용자 코드를 실행하고 예시 호출(tests)을 채점한다. 앱(Web Worker)과 build_check.js(Node)가 같이 쓴다.
function fmt(v, inner) {
  if (typeof v === "string") return inner ? JSON.stringify(v) : v;
  if (typeof v === "number") return Object.is(v, -0) ? "0" : String(v);
  if (typeof v === "bigint") return v + "n";
  if (typeof v === "function") return /^class\b/.test(Function.prototype.toString.call(v)) ? "class " + (v.name || "") : "ƒ " + (v.name || "익명") + "()";
  if (v === null || v === undefined || typeof v !== "object") return String(v);
  if (typeof v.then === "function") return "Promise {…}";
  if (Array.isArray(v)) return "[" + v.map(x => fmt(x, true)).join(", ") + "]";
  if (v instanceof Set) return "Set(" + v.size + ") {" + [...v].map(x => fmt(x, true)).join(", ") + "}";
  if (v instanceof Map) return "Map(" + v.size + ") {" + [...v].map(([k, x]) => fmt(k, true) + " => " + fmt(x, true)).join(", ") + "}";
  if (v instanceof Error) return v.name + ": " + v.message;
  const name = v.constructor && v.constructor !== Object && v.constructor.name ? v.constructor.name + " " : "";
  const ks = Object.keys(v);
  return name + (ks.length ? "{ " + ks.map(k => (/^[A-Za-z_$가-힣][\w$가-힣]*$/.test(k) ? k : JSON.stringify(k)) + ": " + fmt(v[k], true)).join(", ") + " }" : "{}");
}
function same(a, b) {
  if (typeof a === "number" && typeof b === "number") return a === b || (a !== a && b !== b) || Math.abs(a - b) < 1e-9;
  if (a === b) return true;
  if (!a || !b || typeof a !== "object" || typeof b !== "object") return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (a instanceof Set && b instanceof Set) return same([...a], [...b]);
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && same(a[k], b[k]));
}
const errText = e => (e && e.name ? e.name + ": " + e.message : "Error: " + String(e));
async function runJob(job) {
  const logs = [], push = (...a) => logs.push(a.map(x => fmt(x)).join(" "));
  const con = { log: push, info: push, warn: push, error: push, table: push };
  const names = job.names || [];
  let scope, err = null;
  try {
    scope = new Function("console", job.code + "\n;return {" + names.map(n => `${JSON.stringify(n)}: typeof ${n} !== "undefined" ? ${n} : undefined`).join(", ") + "};")(con);
  } catch (e) { err = errText(e); }
  const results = [];
  if (!err) for (const t of job.tests || []) {
    let exp;
    try { exp = new Function("return (" + t[1] + ");")(); } catch (e) { exp = "(기대값 오류)"; }
    const r = { call: t[0], exp: fmt(exp, true) };

      if (got && typeof got.then === "function") got = await got;
      r.got = fmt(got, true); r.ok = same(got, exp);
    } catch (e) { r.err = errText(e); r.ok = false; }
    results.push(r);
  }

}

, undefined, 배열, 객체 등이 있어요.", "code": "const name = \"민수\";   // 글자 (바꿀 수 없음)\nlet age = 20;          // 숫자 (바꿀 수 있음)\nage = 21;              // OK\n\ntypeof 1        // \"number\"\ntypeof \"a\"      // \"string\"\ntypeof true     // \"boolean\"\ntypeof undefined // \"undefined\"\ntypeof null     // \"object\"  ← 함정!\nArray.isArray([1, 2]) // true", "tip": "const 먼저, 바꿔야 하면 let, var는 안 써요. typeof null과 typeof []는 둘 다 \"object\"예요."}, {"t": "연산자·비교", "easy": "+ - * / % 로 계산하고, === 로 같은지 비교해요. + 는 글자가 하나라도 있으면 이어 붙이기가 돼요. == 는 종류를 억지로 맞춰서 헷갈리니까 늘 === 를 써요.", "code": "1 + 2        // 3\n1 + \"2\"      // \"12\"  글자가 있으면 이어 붙이기\n\"3\" - 1      // 2     - 는 숫자로 바꿔서 계산\n7 % 2        // 1     나머지\n0 === \"\"     // false (종류까지 비교)\nnull ?? \"기본\" // \"기본\" (null, undefined일 때만)\n0 || \"기본\"   // \"기본\" (0, \"\" 도 바꿔 버림)\na > b ? a : b  // 삼항: 조건 ? 참 : 거짓", "tip": "0.1 + 0.2 !== 0.3, NaN !== NaN. 기본값은 ?? 가 || 보다 안전해요."}, {"t": "조건문", "easy": "if는 \"만약 ~면 이걸 해\" 갈림길이에요. 조건에 true/false가 아닌 값이 와도, 거짓 6개(false, 0, \"\", null, undefined, NaN)만 거짓이고 나머지는 전부 참으로 봐요.", "code": "if (score >= 90) return \"A\";\nelse if (score >= 80) return \"B\";\nelse return \"F\";\n\nif ([]) { }   // 빈 배열도 참!\nif (\"0\") { }  // 글자 \"0\"도 참!\n\nswitch (n) {\n  case 1: ...; break;  // break 없으면 아래로 미끄러짐\n  default: ...\n}", "tip": "조건이 겹치면 좁은 조건을 먼저. && 는 둘 다, || 는 하나라도, ! 는 반대."}, {"t": "반복문", "easy": "같은 일을 여러 번 할 때 반복문을 써요. 횟수가 정해져 있으면 for, \"~하는 동안\"이면 while, 배열 값을 하나씩 꺼낼 땐 for...of 예요.", "code": "for (let i = 0; i < 3; i++) { }  // 0, 1, 2\n\nwhile (n > 0) { n--; }           // n-- 꼭!\n\nfor (const x of [10, 20]) { }    // x = 10, 20 (값)\nfor (const k in [10, 20]) { }    // k = \"0\", \"1\" (번호) ← 배열엔 X\n\nfor (const x of arr) {\n  if (x < 0) return x;  // 찾으면 바로 끝\n}", "tip": "i < arr.length (작다)로 써요. <= 면 한 번 더 돌아요. of = 값, in = 키."}, {"t": "함수", "easy": "함수는 재료를 넣으면 결과를 주는 기계예요. 매개변수로 재료를 받고 return 으로 결과를 내보내요. return이 없으면 undefined를 돌려줘요.", "code": "function add(a, b) {\n  return a + b;\n}\nconst double = n => n * 2;        // 화살표 함수\nconst add2 = (a, b) => { return a + b; };\n\nfunction greet(name = \"친구\") { }  // 기본값\nfunction sumAll(...nums) { }       // 나머지: 배열로 모으기\napplyTwice(n => n + 1, 5);          // 함수를 값처럼 넘기기", "tip": "function 선언은 위로 끌어올려져서 먼저 불러도 되고, const 화살표 함수는 안 돼요. { } 를 쓰면 return 필수."}, {"t": "배열", "easy": "배열은 번호가 붙은 칸들이에요. 번호는 0부터 시작하고, 마지막 칸 번호는 length - 1 이에요. 배열을 다른 변수에 넣으면 복사가 아니라 같은 배열을 가리켜요.", "code": "const arr = [10, 20, 30];\narr[0]               // 10\narr[arr.length - 1]  // 30\narr.push(40);        // 원본에 추가 (const여도 OK)\nconst copy = [...arr];         // 복사\nconst more = [...arr, 50];     // 복사 + 추가\nconst [a, b] = arr;            // 구조 분해: a=10, b=20\narr.includes(20)     // true\n[10, 1, 2].sort()    // [1, 10, 2] ← 글자 순!\n[10, 1, 2].sort((a, b) => a - b) // [1, 2, 10]", "tip": "원본을 바꾸는 것: push, pop, sort, reverse, splice. 숫자 정렬은 (a, b) => a - b."}, {"t": "배열 메서드", "easy": "배열 메서드는 반복문을 한 줄로 줄여 주는 도구예요. map은 모양 바꾸기, filter는 골라내기, reduce는 하나로 합치기, find는 하나 찾기예요.", "code": "[1, 2, 3].map(n => n * 2)          // [2, 4, 6]\n[1, 2, 3].filter(n => n > 1)       // [2, 3]\n[1, 2, 3].reduce((s, n) => s + n, 0) // 6\nusers.find(u => u.id === 2)         // 첫 번째 하나\n[60, 70].every(s => s >= 60)        // 전부? true\n[50, 70].some(s => s < 60)          // 하나라도? true\n[1, 2].forEach(n => console.log(n)) // 결과는 undefined", "tip": "filter → map → reduce 순서로 이어 써요. reduce에는 시작값(, 0)을 꼭!"}, {"t": "객체", "easy": "객체는 이름표(키)가 붙은 서랍장이에요. obj.키 나 obj[\"키\"] 로 꺼내요. 키 이름이 변수에 들어 있으면 대괄호를 써요.", "code": "const user = { name: \"민수\", age: 20 };\nuser.name            // \"민수\"\nconst key = \"age\";\nuser[key]            // 20 (변수 속 이름으로)\nuser.address?.city   // 없으면 undefined (에러 X)\nObject.keys(user)    // [\"name\", \"age\"]\nObject.entries(user) // [[\"name\",\"민수\"], [\"age\",20]]\nconst older = { ...user, age: 21 }; // 복사 + 덮어쓰기\nconst { name, age } = user;        // 구조 분해", "tip": "객체끼리 === 는 같은 객체일 때만 true. 구조 분해 기본값은 undefined일 때만 쓰여요."}, {"t": "문자열", "easy": "문자열은 글자 목걸이예요. 한 번 만들면 안의 글자를 바꿀 수 없고, 메서드들은 늘 새 글자를 만들어 돌려줘요.", "code": "const s = \"Hello\";\ns.length            // 5\ns[0]                // \"H\"\ns.toUpperCase()     // \"HELLO\"\ns.slice(1, 3)       // \"el\" (끝 번호는 안 들어감)\ns.split(\"\")         // [\"H\",\"e\",\"l\",\"l\",\"o\"]\n[\"a\",\"b\"].join(\"-\") // \"a-b\"\n\"  hi \".trim()      // \"hi\"\ns.includes(\"ell\")   // true\n`${s}, 민수!`       // 템플릿 문자열", "tip": "글자 ↔ 배열은 split / join. 뒤집기는 split(\"\").reverse().join(\"\")."}, {"t": "스코프·클로저", "easy": "스코프는 변수가 보이는 범위예요. let/const는 { } 블록 안에서만 보여요. 클로저는 안쪽 함수가 바깥 함수의 변수를 계속 기억하는 거예요.", "code": "function makeCounter() {\n  let count = 0;          // 비밀 주머니\n  return () => ++count;   // 기억하는 함수\n}\nconst c = makeCounter();\nc(); c();  // 1, 2\n\nconsole.log(a); var a = 1;  // undefined\nconsole.log(b); let b = 1;  // ReferenceError\n\nfor (var i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 3 3 3\nfor (let i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 0 1 2", "tip": "반복 변수는 let. 클로저 = 함수 + 기억하는 바깥 변수."}, {"t": "클래스·this", "easy": "클래스는 객체를 찍어내는 틀이에요. new로 만들 때 constructor가 실행되고, this는 \"지금 만든(부른) 그 객체\"예요. extends로 부모 기능을 물려받아요.", "code": "class Dog {\n  constructor(name) { this.name = name; }\n  bark() { return this.name + \": 멍멍\"; }\n  get upper() { return this.name.toUpperCase(); } // getter\n}\nconst d = new Dog(\"초코\");\nd.bark();   // \"초코: 멍멍\"\nd.upper;    // 괄호 없이\n\nclass Puppy extends Dog {\n  bark() { return this.name + \": 왈\"; } // 덮어쓰기\n}\nconst f = d.bark; f();  // TypeError: this가 없음", "tip": "this는 점(.) 앞의 객체. 메서드를 떼어 넘기면 this를 잃어요 → () => d.bark() 로 감싸요."}, {"t": "비동기", "easy": "비동기는 \"시간이 걸리는 일을 기다리는 동안 다른 일 하기\"예요. Promise는 \"다 되면 알려 줄게\" 약속이고, async 함수 안에서 await로 그 약속을 기다려요.", "code": "const wait = ms => new Promise(r => setTimeout(r, ms));\n\nasync function load() {\n  await wait(100);             // 기다리기\n  const res = await fetch(url); // 서버 응답 기다리기\n  return res.json();\n}\nconst [a, b] = await Promise.all([p1, p2]); // 같이 기다리기\n\n// 순서: 일반 코드 → Promise.then → setTimeout\nconsole.log(1);\nsetTimeout(() => console.log(2));\nPromise.resolve().then(() => console.log(3));\n// 1, 3, 2", "tip": "async 함수는 늘 Promise를 돌려줘요. 결과에 [object Promise]가 보이면 await를 빼먹은 거예요."}, {"t": "실무", "easy": "실무 코드는 \"밖에서 온 값은 믿지 않기\", \"원본은 바꾸지 않기\", \"작은 함수를 조합하기\"가 기본이에요.", "code": "try { JSON.parse(text); } catch (e) { /* 망가진 값 대비 */ }\n(12000).toLocaleString(\"ko-KR\")   // \"12,000\"\n[...new Set([1, 1, 2])]            // [1, 2] 중복 제거\nObject.entries(obj).map(([k, v]) => k + \"=\" + v).join(\"&\")\nJSON.stringify({ a: 1, b: undefined }) // '{\"a\":1}'\n[1, 2].includes(\"2\")               // false (종류 다름)", "tip": "입력값은 늘 글자예요. Number()로 바꾸고, trim()으로 공백을 지우고, ?? 로 기본값을 줘요."}]};
</script>
<script>
(function () {
  const P = DATA.problems, STN = DATA.stations, TH = DATA.theory;
  const KEY = "js-commute-v1";
  const $ = id => document.getElementById(id);
  const blank = () => ({ cur: 0, solved: {}, wrong: {}, tries: {}, drafts: {}, mode: "all" });

  // ---------- state ----------
  let st = blank();
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  // ---------- 코드 실행: Web Worker 안에서 돌리고 3초가 넘으면 멈춘다 (무한 반복 대비) ----------
  let workerURL = null;
  try { workerURL = URL.createObjectURL(new Blob([$("runner").textContent + "\nonmessage = async e => postMessage(await runJob(e.data));"], { type: "text/javascript" })); } catch (e) {}
  const direct = job => runJob(job).catch(err => ({ logs: [], err: errText(err), results: [] }));
  function exec(job) {
    return new Promise(resolve => {
      let w;
      try { if (!workerURL) throw 0; w = new Worker(workerURL); } catch (e) { direct(job).then(resolve); return; }
      const timer = setTimeout(() => { w.terminate(); resolve({ timeout: true, logs: [], results: [] }); }, 3000);
      w.onmessage = e => { clearTimeout(timer); w.terminate(); resolve(e.data); };
      w.onerror = e => { e.preventDefault(); clearTimeout(timer); w.terminate(); direct(job).then(resolve); };
      w.postMessage(job);
    });
  }
  function friendly(err) {
    let m;
    const name = err.split(":")[0], msg = err.slice(name.length + 2);
    if (name === "SyntaxError") return "문법 오류가 있어요. 괄호 ( ), 중괄호 { }, 따옴표 짝이 맞는지, 쉼표나 => 가 빠지지 않았는지 보세요. (" + msg + ")";
    if ((m = msg.match(/^(\S+) is not defined/))) return `"${m[1]}"라는 이름을 찾을 수 없어요. 철자(대소문자 포함)를 확인하거나, 그 변수를 먼저 만들었는지 보세요.`;
    if ((m = msg.match(/access '(\S+)' before initialization/))) return `"${m[1]}"를 만들기(선언하기) 전에 썼어요. 선언하는 줄을 위로 올려 보세요.`;
    if (/Assignment to constant/.test(msg)) return "const로 만든 변수에 다시 값을 넣었어요. 바뀌는 값이면 let으로 만들어요.";
    if ((m = msg.match(/(\S+) is not a function/))) return `${m[1]}은(는) 함수가 아닌데 ( )로 불렀어요. 이름 철자나 점(.) 앞의 값이 맞는지 보세요.`;
    if ((m = msg.match(/Cannot read propert(?:y|ies) of (undefined|null)(?: \(reading '(.+?)'\))?/))) return `${m[1]}에서 ${m[2] ? "." + m[2] + " 을(를)" : "속성을"} 꺼내려 했어요. 점(.) 앞의 값이 비어 있지 않은지, ?. 가 필요한지 보세요.`;
    if (/Reduce of empty array/.test(msg)) return "빈 배열에 reduce를 했는데 시작값이 없어요. reduce(..., 0) 처럼 시작값을 넣어 보세요.";
    if (/is not a constructor/.test(msg)) return "new 로 만들 수 없는 것에 new를 붙였어요. class 이름을 확인해 보세요.";
    if (/Maximum call stack|too much recursion/.test(msg)) return "함수가 자기 자신을 끝없이 부르고 있어요. 멈추는 조건이 있는지 보세요.";
    return "실행 중 오류: " + err;
  }
  const TIMEOUT_MSG = "3초 안에 끝나지 않았어요. 끝나지 않는 반복(무한 반복)이 있는지 보세요. while 안에서 조건이 바뀌나요? i++ 를 빼먹지 않았나요?";

  // ---------- 그리기 도우미 ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // 문제·해설 글 속 코드 조각을 코드 글씨로 (escape 한 뒤라 따옴표는 &quot;)
  const inlineCode = s => esc(s).replace(/(`[^`]+`|(?:\b|\.)[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\([^()]*\)(?:\.[A-Za-z_$][\w$]*\([^()]*\))*|\[\.\.\.[^\]]*\]|\.\.\.[a-z]+|===|!==|\?\?|\?\.|=&gt;|&amp;&amp;|\|\||\b(?:typeof|return|const|let|var|null|undefined|NaN|async|await|this|true|false)\b)/g, "<code>$1</code>");
  function list() {
    if (st.mode === "wrong") return (st.queue || []).slice();
    if (st.mode === "trap") return P.map((p, i) => i).filter(i => P[i].trap);
    return P.map((p, i) => i);
  }
  function fb(kind, title, body) {
    const d = document.createElement("div"); d.className = "fb " + kind;
    d.innerHTML = (title ? `<h3>${title}</h3>` : "") + (body || "");
    $("fb").appendChild(d); bindTheory(d); return d;
  }
  const theoryBtn = si => `<button class="btn ghost theory" data-th="${si}">📖 ${esc(STN[si])} 이론 보기</button>`;
  function bindTheory(root) { root.querySelectorAll("[data-th]").forEach(b => b.onclick = () => show("theory", true, +b.dataset.th)); }
  function renderExp(p) {
    $("exp").innerHTML = `<div class="exp">
      <div class="row"><span class="lab">쉽게 말하면</span><p>${inlineCode(p.exp.easy)}</p></div>
      <div class="row"><span class="lab">실무 스타일</span><p>${inlineCode(p.exp.work)}</p></div>
      <div class="row"><span class="lab">시험 꿀팁</span><p>${inlineCode(p.exp.tip)}</p></div>
      ${theoryBtn(p.st)}</div>`;
    bindTheory($("exp"));
  }

  function renderTop() {
    const solved = Object.keys(st.solved).length;
    $("score").innerHTML = `<b>${solved}</b>/${P.length}`;
    const wrongN = Object.keys(st.wrong).length;
    $("modeWrong").textContent = `오답 다시 풀기 ${wrongN}`;
    $("modeWrong").disabled = wrongN === 0 && st.mode !== "wrong";
    ["All", "Wrong", "Trap"].forEach(k => $("mode" + k).setAttribute("aria-pressed", String(st.mode === k.toLowerCase())));
    const cs = P[st.cur].st;
    $("stNow").textContent = STN[cs];
    $("prevStName").textContent = cs > 0 ? STN[cs - 1] : "처음";
    $("nextStName").textContent = cs < STN.length - 1 ? STN[cs + 1] : "끝";
    $("prevSt").disabled = cs === 0; $("nextSt").disabled = cs === STN.length - 1;
  }
  const caretAt = s => { const k = s.indexOf("\n  \n"); return k >= 0 ? k + 3 : s.length; };

  function render() {
    const i = st.cur, p = P[i], L = list(), pos = L.indexOf(i);
    renderTop();
    $("meta").innerHTML =
      `<span class="tag">${esc(STN[p.st])}</span>` +
      (p.trap ? '<span class="tag trap">함정</span>' : "") +
      `<span class="tag mc">${p.type === "mc" ? "객관식" : "코드 작성"}</span>` +
      (st.solved[i] ? '<span class="tag solved">정답</span>' : "") +
      `<span class="qnum">${i + 1} / ${P.length}${st.mode !== "all" ? ` · 이 모드 ${pos + 1}/${L.length}` : ""}</span>`;
    $("q").innerHTML = inlineCode(p.q);
    $("fb").innerHTML = ""; $("exp").innerHTML = "";
    const area = $("answerArea");
    if (p.type === "mc") {
      $("codeWrap").innerHTML = p.code ? `<pre class="code">${esc(p.code)}</pre>` : "";
      area.innerHTML = '<div class="choices">' + p.choices.map((c, k) =>
        `<button class="choice" data-k="${k}"><span class="n">${"①②③④"[k]}</span><span class="c">${esc(c)}</span></button>`).join("") + "</div>" +
        `<div class="actions" style="margin-top:8px"><button class="btn ghost" id="hintBtn">힌트</button><button class="btn ghost" id="showBtn">정답 보기</button>${theoryBtn(p.st)}</div>`;
      area.querySelectorAll(".choice").forEach(b => b.onclick = () => pickChoice(i, +b.dataset.k, b));
      if (st.solved[i]) { area.querySelector(`.choice[data-k="${p.answer}"]`).classList.add("picked-ok"); renderExp(p); }
    } else {
      $("codeWrap").innerHTML = '<div class="examples"><span class="lab">이렇게 나오면 정답</span>' + p.tests.map(t =>
        `<div class="ex">${esc(t[0])} <span class="arr">→</span> <span class="val">${esc(t[1])}</span></div>`).join("") + "</div>";
      area.innerHTML = `<div class="editor">
        <textarea id="src" rows="7" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="코드 입력" inputmode="none"></textarea>
        <div class="keys" id="k1" aria-label="키워드 버튼"></div>
        <div class="keys" id="k2" aria-label="기호와 메서드 버튼"></div>
        <div class="keys" id="k3" aria-label="이름과 값 버튼"></div>
        <div class="actions">
          <button class="btn" id="runBtn">실행</button>
          <button class="btn primary" id="gradeBtn">채점하기</button>
        </div>
        <div class="actions"><button class="btn ghost" id="hintBtn">힌트</button><button class="btn ghost" id="showBtn">정답 보기</button><button class="btn ghost" id="undoBtn">↶ 한 단계 전</button><button class="btn ghost" id="clearBtn">처음 틀로</button><button class="btn ghost" id="kbdBtn" aria-pressed="false">키보드 켜기</button>${theoryBtn(p.st)}</div>
      </div>`;
      const ta = $("src"); ta.value = st.drafts[i] ?? p.starter;

  // ---------- 버튼 조립: 정답 코드에 필요한 조각만, 순서는 섞어서 ----------
  const TOKRE = /`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\d+(?:\.\d+)?|\.\.\.|\??\.[A-Za-z_$][\w$]*\(?|[A-Za-z_$][\w$]*\(?|===|!==|=>|\?\?|&&|\|\||\+\+|--|[+\-*\/%]=|<=|>=|==|!=|[{}()[\];,:?!<>=+\-*\/%.]/g;

      else if (/^[`"'\d]/.test(t)) r3.push([t, "val"]);
      else if (/^\??\.[A-Za-z_$]/.test(t) || /\($/.test(t)) r2.push([t, "fn"]);
      else if (/^[A-Za-z_$]/.test(t)) r3.push([t, "nm"]);
      else r2.push([t, ""]);

    r1.sort(cmp); r2.sort((a, b) => (a[1] === "fn") - (b[1] === "fn") || cmp(a, b)); r3.sort((a, b) => (a[1] === "val") - (b[1] === "val") || cmp(a, b));
    r1.forEach(([k, c]) => keyBtn($("k1"), ta, k, c));
    r2.forEach(([k, c]) => keyBtn($("k2"), ta, k, c));
    r3.forEach(([k, c]) => keyBtn($("k3"), ta, k, c));
    keyBtn($("k3"), ta, "⏎", "ctl", "줄 바꾸기"); keyBtn($("k3"), ta, "⌫", "ctl", "한 조각 지우기");
  }
  function keyBtn(box, ta, k, cls, label) {
    const b = document.createElement("button"); b.type = "button"; b.className = "key " + cls; b.textContent = k;

  }
  let undoStack = [];
  function pushUndo(ta) { if (undoStack[undoStack.length - 1] !== ta.value) undoStack.push(ta.value); if (undoStack.length > 100) undoStack.shift(); }

  // 홈 화면에 추가: 설치 창을 띄울 수 있는 브라우저면 바로 띄우고, 아니면 방법을 보여준다
  let installEvt = null;

  const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  const IGUIDE = `<p><b>아이폰 (Safari)</b><br>화면 아래 공유 버튼(네모에 화살표) → <b>홈 화면에 추가</b> → 추가</p>
    <p><b>갤럭시·안드로이드 (Chrome, 삼성 인터넷)</b><br>오른쪽 위 ⋮ 또는 아래 ≡ 메뉴 → <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>)</p>
    <p>Claude 앱 안에서 보고 있다면, 먼저 링크를 Safari나 Chrome으로 열어 주세요.</p>`;
  document.querySelectorAll("[data-install]").forEach(btn => {
    if (isStandalone()) { btn.parentElement.hidden = true; return; }
    btn.onclick = async () => {
      if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
      const g = btn.nextElementSibling; g.innerHTML = IGUIDE; g.hidden = !g.hidden;
      btn.textContent = g.hidden ? "홈 화면에 추가" : "설명 닫기";
    };
  });
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
