<h1>개인정보처리방침</h1>
<p>SQLD 오답킬러(개발자: 새벽감자)는 이용자의 개인정보를 수집하지 않습니다.</p>
<ul>
  <li>회원가입, 로그인, 광고, 분석 도구가 없습니다.</li>
  <li>푼 문제, 정답률, 오답노트 기록은 이용자 기기 안의 브라우저 저장소에만 저장되며 개발자나 다른 서버로 전송되지 않습니다.</li>
  <li>앱을 지우거나 브라우저 데이터를 삭제하면 이 기록도 함께 삭제됩니다.</li>
</ul>
<p>문의는 Google Play 스토어의 개발자 연락처로 보내 주세요.</p>
<p>시행일: 2026년 10월 3일</p>
